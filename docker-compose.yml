# Sign a profile in once, then run against it:
#
#   docker compose run --rm --service-ports signin
#   docker compose run --rm rewards-farmer

services:
  rewards-farmer:
    build: .
    image: rewards-farmer
    shm_size: 1gb
    environment:
      # trends is the zero-configuration default. For LLM mode, choose native
      # Ollama, OpenAI-compatible Chat Completions, or Anthropic Messages.
      QUERY_SOURCE: ${QUERY_SOURCE:-trends}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-}
      LLM_EXTRA_HEADERS_JSON: ${LLM_EXTRA_HEADERS_JSON:-}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-}
      LLM_ANTHROPIC_VERSION: ${LLM_ANTHROPIC_VERSION:-}
      REWARDS_HEADLESS: "1"
      REWARDS_ACCOUNTS: ${REWARDS_ACCOUNTS:-}
      OLLAMA_HOST: ${OLLAMA_HOST:-}
    volumes:
      - ./data-dir:/app/data-dir
      - ./visual_search.jpg:/app/visual_search.jpg:ro

  # One-off sign-in. The Edge instance that writes the profile runs inside the
  # same Linux image that later reads it, avoiding Windows DPAPI/macOS Keychain
  # incompatibility with Chromium cookies.
  signin:
    build: .
    image: rewards-farmer
    shm_size: 1gb
    command: ["python", "src/signin.py"]
    environment:
      # Sign in one profile at a time.
      REWARDS_ACCOUNTS: ${REWARDS_ACCOUNTS:-}
    ports:
      # Security boundary: while this service is running, this is a live
      # Microsoft sign-in screen. Never publish it on 0.0.0.0.
      - "127.0.0.1:6080:6080"
    volumes:
      - ./data-dir:/app/data-dir
